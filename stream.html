<script>
const streamUrl = "https://civradio.loca.lt/listen/civradio/radio.mp3";
fetch(streamUrl, {
  headers: { "Bypass-Tunnel-Reminder": "1" }
})
.then(response => response.blob())
.then(blob => {
  const url = URL.createObjectURL(blob);
  const audio = document.createElement("audio");
  audio.controls = true;
  audio.autoplay = true;
  audio.src = url;
  document.querySelector("section.page").appendChild(audio);
})
.catch(err => console.error("Failed to load stream:", err));
</script>
