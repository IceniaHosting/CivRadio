<!DOCTYPE html>

<body>
  <center>
    <header class="header">

        <h1>WCVR CivRadio 90.7FM</h1>
        <nav>
          <a href="index.html">Home</a>

  <main class="container">
    <section class="page">
      <h2>Listen Live</h2>
      <p>Click play on the stream below to listen:</p>

      <h3 style="margin-top: 2em;">CivRadio</h3>
      <p>Various music and shows.</p>

      <!-- Audio tag with bypass JS -->
      <audio id="civradio-player" controls autoplay></audio>

<script>
const audio = document.getElementById("civradio-player");
const streamUrl = "https://civradio.loca.lt/listen/civradio/radio.mp3";
fetch(streamUrl, {
  headers: { "Bypass-Tunnel-Reminder": "1" }
})
.then(response => response.blob())
.then(blob => {
  audio.src = URL.createObjectURL(blob);
})
.catch(err => console.error("Failed to load stream:", err));
</script>

      <script>
      const audio = document.getElementById("civradio-player");
      const streamUrl = "https://placeholder.loca.lt/listen/civradio/radio.mp3"; // Python script will update this
      fetch(streamUrl, {
        headers: { "Bypass-Tunnel-Reminder": "1" }
      })
      .then(response => response.blob())
      .then(blob => {
        audio.src = URL.createObjectURL(blob);
      })
      .catch(err => console.error("Failed to load stream:", err));
      </script>

    </section>
